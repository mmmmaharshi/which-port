# Builds a release on a tag and attaches it to the GitHub Release.
#
# Replaces a hand-typed cross-compilation loop with something reproducible: the
# binaries come from a tagged commit with logs anyone can read, rather than from
# one person's machine on one afternoon.
#
# A tag whose name ends in -rc or -beta is a prerelease, so the "latest" release
# on the repo page never points at a candidate.
#
# The name is release and the file is release.yml, but it now also runs on every
# push to master. That is deliberate: the checks belong to a commit, not to a
# tag, and running them only at tag time left the native-Linux branch of
# scripts/test-all.ps1 unexercised for weeks at a time. Only the last job
# publishes anything, and it waits for the other two.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Manual, for cutting a release without a tag first. The version is required,
  # so the tag cannot be forgotten: a release with no tag is unreachable from
  # `git clone`, and the checksum file then refers to a commit nothing points at.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, with the v (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The Linux half of the test suite, on a real Linux runner, on every push.
  #
  # This job exists because the checks used to run only inside the release job, so
  # the native-Linux branch of scripts/test-all.ps1 went unexercised between
  # releases -- and a branch nobody runs is a branch that rots. It runs there too
  # now, which is the only place that can.
  #
  # The runner image is pinned, as in the release job. ubuntu-latest migrates to
  # Ubuntu 26 on 19 October 2026 and this workflow should not change shape because
  # someone else's image did.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-zig
      # The suite is PowerShell because the Windows and Linux invocations
      # genuinely differ, and a step that cannot run is a step nobody trusts.
      - name: Checks
        shell: pwsh
        run: ./scripts/test-all.ps1

  # Proves the parts that do not depend on a platform compile and pass on a real
  # macOS runner, and that the release targets still cross-compile from a macOS
  # host. ADR 0001 claims the toolchain targets every platform from one host, and
  # until now that claim was only ever checked from Windows.
  #
  # macOS produces no binaries yet. src/lookup.zig is a compile error on .macos
  # because the lsof lookup does not exist, so `zig build all-targets` skips those
  # two targets and the suites here are the three that take no platform at all.
  # When the lookup lands, drop .buildable = false from those two entries in
  # build.zig and this job picks up both macOS binaries on the next release.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        run: |
          url=https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz
          sha=$(curl -sSfL https://ziglang.org/download/index.json | jq -r '."0.17.0"."aarch64-macos".shasum')
          curl -sSfL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | shasum -a 256 -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-0.17.0" >> "$GITHUB_PATH"

      # Named by hand rather than through scripts/test-all.ps1, because that
      # script skips the whole presentation layer on macOS: report.zig imports
      # lookup.zig for Occupier and unresolved, and lookup.zig picks its platform
      # at module scope. When the lsof lookup lands, that coupling goes with it
      # and this job can call the script like the others.
      - name: Unit suites that take no platform
        run: |
          zig test src/addr.zig
          zig test src/parse_proc.zig
          zig test src/report.zig

      - name: Every buildable target still cross-compiles from macOS
        run: zig build all-targets

  release:
    # Skipped, not failed, unless this run is actually a release. A push to master
    # has no tag and no version input, so the Resolve the version step below
    # rejects it -- and a workflow that goes red on every ordinary push is a
    # workflow people learn to ignore, which is how the whole Linux suite went
    # unrun in the first place. A skipped job reads as skipped.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [linux, macos]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      # v7 runs on Node 24. v4 targeted Node 20, which GitHub deprecated, so
      # every run carried a warning about an action the workflow cannot change.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-zig

      # No check step. The linux job above runs ./scripts/test-all.ps1 against
      # this same commit, and this job waits for it, so repeating the run here
      # would spend a runner proving a thing already proven. What stays is the
      # build, because the binaries are published from this runner's output.
      - name: Build every shipped target
        run: zig build all-targets

      # Raw, for every target.
      #
      # The previous release shipped .zip on Windows and .gz on Linux, on the
      # reasoning that a browser will not download a raw .exe usefully. That was
      # asserted without checking and is wrong: GitHub serves an .exe as
      # application/octet-stream and it downloads fine. `fd` and `bat` ship raw
      # Windows binaries; `ripgrep` and `dust` ship archives. There is no
      # convention here to follow, only a choice.
      #
      # Raw wins for this tool because its whole pitch is "copy one file onto
      # your PATH". An archive inserts an extraction step into the one command
      # the README is built around, and in exchange saves 340 KB on the Windows
      # build. Compression is not needed for correctness and is not what makes a
      # download work.
      - name: List the artifacts
        run: |
          cd zig-out/release
          ls -la

      # Written to the parent and moved back in, because `sha256sum *` would
      # otherwise checksum SHA256SUMS as it was being written.
      #
      # The sed is not decoration. Whether sha256sum marks each line with a `*`
      # depends on how that coreutils build was compiled, so the separator
      # varies by platform, and the asterisk becomes part of the filename a
      # reader copies out. Homebrew and Scoop match on the digest and the name,
      # so `*which-port-...` is a string that verifies nothing. Normalising to
      # `digest␣␣name` makes the file identical wherever it was generated.
      - name: Checksums
        run: |
          cd zig-out/release
          sha256sum * > ../RAW
          sed 's/^\([0-9a-f]*\) [*]\{1\}/\1  /' ../RAW > ../SHA256SUMS
          mv ../SHA256SUMS .
          rm ../RAW
          # Printed on purpose: a checksum nobody can see is a checksum nobody
          # checks. Homebrew and Scoop both refuse to install without this file.
          cat SHA256SUMS

      - name: Resolve the version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi
          case "$version" in
            v*) ;;
            *) echo "version must start with v, got: $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # gh is not authenticated by default. actions/checkout leaves no token
          # in the environment, so this step would fail at the push with an
          # unhelpful "could not read Username". Publishing a release needs one.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$VERSION" in
            *-rc*|*-beta*|*-alpha*) prerelease="--prerelease" ;;
          esac
          # Create the tag only if the remote does not already have it. Asked of
          # the remote rather than of the local clone, because actions/checkout
          # fetches one commit and no tags: `git rev-parse` reports a pushed tag
          # as missing, the push is rejected, and the release dies at the last
          # step. ls-remote answers from the remote, so depth does not matter.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          # Notes come from the README rather than a changelog nobody maintains:
          # what the tool does, how to install it, and what the exit codes mean
          # is what a reader of the release page needs.
          gh release create "$VERSION" zig-out/release/* $prerelease \
            --title "which-port $VERSION" \
            --notes-file README.md
